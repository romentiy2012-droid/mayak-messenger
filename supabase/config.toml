# Функцию вызывает триггер базы без JWT; защита — в mayak_push_claim.
[functions.push]
verify_jwt = false

# Участник ещё не вошёл; защита — одноразовый код из ссылки владельца.
[functions.reset]
verify_jwt = false

# JWT проверяется через Auth API в самой функции; запись разрешает RPC участника.
[functions.video]
verify_jwt = false

# Проверяет JWT через Auth API и актуальную роль владельца; RPC доступны только service_role.
[functions.storage-admin]
verify_jwt = false

# ESP32 использует отдельный ключ станции; проверка ключа и записи внутри функции/RPC.
[functions.weather-ingest]
verify_jwt = false
